<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"> <!-- Character encoding -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Mobile-friendly -->
  <title>Study Editor</title>
  <link rel="stylesheet" href="editor.css"> <!-- External stylesheet -->
</head>
<body>
  <header>
    <h1>Study Editor</h1>
  </header>
  <main>
    <!-- Study Editor Form -->
    <form id="study-form">
      <div>
        <label for="study-number">Study Number:</label>
        <input type="number" id="study-number" required>
      </div>
      <div>
        <label for="study-recommended">Recommended:</label>
        <input type="checkbox" id="study-recommended">
      </div>
      <div>
        <label for="study-title">Title:</label>
        <input type="text" id="study-title" required>
      </div>
      <div>
        <label for="study-description">Description:</label>
        <textarea id="study-description" required></textarea>
      </div>
      
      <!-- Container for dynamic sections -->
      <div id="sections-container"></div>
      <button type="button" id="add-section-btn">Add Section</button>
      <br>
      <button type="button" id="generate-btn">Generate JSON & Preview</button>
      <button type="button" id="copy-btn">Copy JSON</button>
    </form>
    
    <!-- Output JSON area -->
    <h2>Output JSON:</h2>
    <pre id="output"></pre>
    
    <!-- Live Preview area -->
    <h2>Live Preview:</h2>
    <div id="preview-pane"></div>
  </main>
  
  <script src="editor.js"></script>
</body>
</html>
